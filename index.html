<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一起公会 - 魔兽世界休闲公会">
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>一起 - 魔兽世界公会</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="img/favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div class="guild-header-container"></div>
<nav class="nav-container" aria-label="主菜单"></nav>
<!-- 主内容区 -->
  <main class="main-content">

    <!-- 职业天梯（标签切换，一次只显示一份；总览页 pages/all-rankings.html 仍然六份并列） -->
    <article class="content-card">
      <header>
        <h2>职业专精天梯图</h2>
        <p class="stats-update-time">
          Wowhead 每周自动更新 · <a href="pages/all-rankings.html">查看六份并列</a>
        </p>
      </header>
      <div id="home-tier-tabs"></div>
    </article>

    <!-- 公会统计数据 -->
    <article class="content-card">
      <header>
        <h2>公会统计</h2>
        <p class="stats-update-time">
          数据更新: <span id="lastUpdated">-</span>
          <span id="activeWindowHint" class="stats-window-hint"></span>
        </p>
      </header>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalMembers"><span class="skeleton skeleton-line"></span></div>
          <div class="stat-label">总成员</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="activeMembers"><span class="skeleton skeleton-line"></span></div>
          <div class="stat-label" id="activeMembersLabel">近期活跃</div>
        </div>

        <div class="stat-card">
          <div class="stat-number" id="dataCompleteness"><span class="skeleton skeleton-line"></span></div>
          <div class="stat-label">数据完整率</div>
        </div>
      </div>
      
      <div class="stats-charts" aria-busy="true">
        <!-- 职业分布 - 单行 -->
        <div class="chart-container full-width">
          <h3>职业分布</h3>
          <div class="chart" id="classChart">
            <div class="chart-skeleton">
              <span class="skeleton skeleton-bar"></span>
              <span class="skeleton skeleton-bar"></span>
              <span class="skeleton skeleton-bar"></span>
              <span class="skeleton skeleton-bar"></span>
              <span class="skeleton skeleton-bar"></span>
            </div>
          </div>
        </div>
        
        <!-- 阵营分布和性别分布 - 一行两列 -->
        <div class="charts-row">
          <div class="chart-container">
            <h3>阵营分布</h3>
            <div class="chart" id="factionChart">
              <div class="chart-skeleton">
                <span class="skeleton skeleton-circle"></span>
              </div>
            </div>
          </div>
          <div class="chart-container">
            <h3>性别分布</h3>
            <div class="chart" id="genderChart">
              <div class="chart-skeleton">
                <span class="skeleton skeleton-circle"></span>
              </div>
            </div>
          </div>
        </div>
        
        <!-- 服务器分布和种族分布 - 一行两列 -->
        <div class="charts-row">
          <div class="chart-container">
            <h3>服务器分布（前25个）</h3>
            <div class="chart" id="realmChart">
              <div class="chart-skeleton">
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
              </div>
            </div>
          </div>
          <div class="chart-container">
            <h3>种族分布</h3>
            <div class="chart" id="raceChart">
              <div class="chart-skeleton">
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
                <span class="skeleton skeleton-bar"></span>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </article>

    <!-- 成就点数排行榜 -->
    <article class="content-card">
      <header>
        <h2>🏆 成就点数排行榜</h2>
        <p class="stats-update-time">前20名</p>
      </header>
      <div class="ranking-table-container">
        <table class="ranking-table" id="achievementRanking">
          <thead>
            <tr>
              <th class="rank-header">排名</th>
              <th class="character-name-header">角色名</th>
              <th class="class-header">职业</th>
              <th class="achievement-points-header">成就点数</th>
            </tr>
          </thead>
          <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
          </tbody>
        </table>
      </div>
    </article>

    <!-- 史诗钥石评分排行榜 -->
    <article class="content-card">
      <header>
        <h2>🗝️ 史诗钥石评分排行榜</h2>
        <p class="stats-update-time">前20名</p>
      </header>
      <div class="ranking-table-container">
        <table class="ranking-table" id="mythicScoreRanking">
          <thead>
            <tr>
              <th class="rank-header">排名</th>
              <th class="character-name-header">角色名</th>
              <th class="class-header">职业</th>
              <th class="mythic-score-header">钥石评分</th>
              <th class="item-level-header">平均装等</th>
            </tr>
          </thead>
          <tbody>
            <!-- 数据将通过JavaScript动态填充 -->
          </tbody>
        </table>
      </div>
    </article>

    <article class="content-card">
      <header>
        <h2>会员风采</h2>
      </header>
      <img src="img/mdz.webp" alt="一起洗脚王" class="mechanism-img zoomable">
    </article>

    <article class="content-card">
      <header>
        <h2>公会主播</h2>
      </header>
      <div class="iframe-container">
        <iframe src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=30654671&quality=0"
                frameborder="no" 
                framespacing="0" 
                scrolling="no" 
                allow="autoplay; encrypted-media" 
                allowfullscreen="true"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation"
                loading="lazy"
                referrerpolicy="no-referrer">
        </iframe>
      </div>
    </article>
  </main>

<script type="module" src="js/pages/home-tier-list.js"></script>
<script type="module" src="js/main.js"></script>
</body>
  
</html>
