name: 天梯数据刷新

# 定期从 Wowhead guide 抓取职业天梯，有变化就提交到 main。
# 取页方式见 tools/fetch_tier_lists.py 顶部说明：2026-11-09 的定时任务里 runner 直连也被
# CloudFront 403 挡住，auto 逐个退回 r.jina.ai 阅读器；阅读器偶尔回没渲染完的空壳页，脚本内部会重试。
#
# 为什么一周跑两次（2026-11-26 结项时加）：结项后无人值守，「周一跑一次失败 = 天梯落后一整周」。
# 加一个周四的兜底轮次，失败窗口从 7 天缩到 3~4 天；数据没变化时第二次不会产生空提交。
# cron 都避开整点 —— GitHub 的 schedule 在整点高负载时会被延迟甚至丢弃。
on:
  schedule:
    - cron: '23 1 * * 1'   # 每周一 UTC 01:23 = 北京时间 09:23（主轮次）
    - cron: '23 9 * * 4'   # 每周四 UTC 09:23 = 北京时间 17:23（兜底轮次）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 脚本先抓全 6 个页面、全部解析成功才写文件：失败退出码 3，不写半套数据。
      # 以前是先 --check 再生成，同一批页面要抓两遍，阅读器额度翻倍。
      # 外层再包两轮整批重试：脚本内的重试管「单页解析失败」，这层管「整批失败 / runner 冷启动抖动」。
      - name: 抓取并生成
        env:
          # 2026-11-23：runner 的出口 IP 被 jina 判成 bad IP reputation，匿名请求直接 401；
          # 带 key 的请求走授权额度。secret 没配时退回匿名（家里跑不需要 key）。
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          for attempt in 1 2; do
            if python tools/fetch_tier_lists.py; then
              exit 0
            fi
            echo "第 ${attempt}/2 轮整批失败，90 秒后整体重试" >&2
            sleep 90
          done
          echo "两轮整批都失败，本次不写任何文件（原文见 .cache/tier-lists/*.failed.md）" >&2
          exit 3

      # 新专精没登记时脚本会直接失败，这里再让测试兜一层：
      # 天梯里的每个专精 id 都必须能在 specs.js 解析出来。
      - name: JS 测试
        run: node --test

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data
          if git diff --cached --quiet; then
            echo "没有实际改动，跳过提交"
            exit 0
          fi
          git commit -m "data(tier): 自动更新职业天梯（Wowhead）"
          git push

      # 「解析出 0 个专精」要能看出是页面改版还是根本没抓到正文，失败时把原文留一份。
      - name: 失败时上传抓到的原文
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tier-list-pages
          path: .cache/tier-lists
          include-hidden-files: true
          if-no-files-found: ignore
