name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # 测试线跟 LTS 走：Node 20 已于 2026-04 结束支持，不再在 EOL 运行时上跑测试。
      # 线上实际运行版本由 netlify.toml 的 NODE_VERSION 决定（当前仍是 20）。
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Python 测试会 import 抓取脚本（requests）；JS 测试只用标准库，不需要 npm install，
      # 所以这一步不依赖 package-lock.json 是否最新。
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: JS 单元测试
        run: node --test

      - name: Python 单元测试
        run: python -m unittest discover -s tests/py -p "test_*.py"

      - name: 页面数据校验
        run: python tools/validate.py
